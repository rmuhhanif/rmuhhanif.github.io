<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Spinwheel - Truth or Dare</title>
    <style>
        :root {
            --pink-light: #ffb6c1;
            --pink-dark: #ff69b4;
            --gold: #ffd700;
            --blue-sky: #87ceeb;
            --red-romantic: #ff4500;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #fff0f5 0%, #ffc0cb 100%);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            color: #333;
        }

        /* Festive Background Elements */
        .festive-bg {
            position: absolute;
            font-size: 2rem;
            z-index: 0;
            opacity: 0.6;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .header-title {
            z-index: 10;
            text-align: center;
            margin-bottom: 20px;
            padding: 0 15px;
        }

        .header-title h1 {
            color: var(--pink-dark);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin: 0;
            font-size: 2.5rem;
        }
        .header-title p {
            color: #555;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        /* Wheel Container */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            z-index: 10;
            margin-bottom: 30px;
        }

        @media (min-width: 768px) {
            .wheel-container {
                width: 400px;
                height: 400px;
            }
        }

        /* The Pointer */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid var(--red-romantic);
            z-index: 20;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }

        /* The Wheel */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                var(--pink-light) 0deg 60deg,
                var(--gold) 60deg 120deg,
                var(--pink-dark) 120deg 180deg,
                var(--blue-sky) 180deg 240deg,
                var(--pink-light) 240deg 300deg,
                var(--gold) 300deg 360deg
            );
            border: 8px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1); /* Smooth deceleration */
            position: relative;
        }

        /* Inner circle for aesthetics */
        .wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 50%;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2);
        }

        /* Spin Button */
        .spin-btn {
            background: linear-gradient(135deg, var(--pink-dark), var(--red-romantic));
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 10;
        }
        .spin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.6);
        }
        .spin-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Result Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            position: relative;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid var(--gold);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 1.5rem;
            color: var(--pink-dark);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .category-label {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            color: white;
            font-size: 0.9rem;
        }
        .cat-truth { background-color: var(--blue-sky); }
        .cat-trivia { background-color: var(--gold); color: #333; }
        .cat-dare { background-color: var(--red-romantic); }

        .question-text {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .close-btn {
            background: var(--pink-dark);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .close-btn:hover {
            background: var(--red-romantic);
        }

    </style>
</head>
<body>

    <div class="festive-bg" style="top: 10%; left: 10%;">🎂</div>
    <div class="festive-bg" style="top: 20%; right: 15%; animation-delay: 1s;">💖</div>
    <div class="festive-bg" style="bottom: 15%; left: 20%; animation-delay: 2s;">🎉</div>
    <div class="festive-bg" style="bottom: 25%; right: 10%; animation-delay: 1.5s;">✨</div>
    <div class="festive-bg" style="top: 50%; left: 5%; animation-delay: 0.5s;">💌</div>
    <div class="festive-bg" style="top: 40%; right: 5%; animation-delay: 2.5s;">🎁</div>

    <div class="header-title">
        <h1>Selamat Ulang Tahun, Sayang!</h1>
        <p>Putar rodanya dan bersiaplah untuk keseruannya!</p>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>

            <div id="questionText" class="question-text"></div>
            <button class="close-btn" onclick="closeModal()">Lanjut Main</button>

    </div>

            { type: "Trivia", text: "Apa posisi tidur favoritku? (Miring kiri, miring kanan, telentang, tengkurap?)" },

            { type: "Trivia", text: "Apa nama hewan peliharaan pertamaku atau hewan kesukaanku?" },
            { type: "Trivia", text: "Di dompetku sekarang, tebak ada berapa lembar uang tunai?" },
            { type: "Trivia", text: "Sebutkan 3 barang yang WAJIB aku bawa kalau lagi keluar rumah (selain HP dan dompet)!" },

            { type: "Dare", text: "Tuliskan 'I Love You' menggunakan tangan kirimu (jika kamu non-kidal) atau tangan kananmu (jika kidal) di atas secarik kertas." },
            { type: "Dare", text: "Re-ka ulang (re-enact) gaya pertengkaran kita yang paling absurd tapi pakai bahasa formal bak bangsawan." },
            { type: "Dare", text: "Berikan senyum tergoda (flirting smile) andalanmu ke arahku selama 10 detik tanpa terputus." }

        let isSpinning = false;
        let currentRotation = 0;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const btn = document.getElementById('spinBtn');
            const wheel = document.getElementById('wheel');
            btn.disabled = true;

            // Generate a random additional rotation between 5 and 10 full circles
            const spins = Math.floor(Math.random() * 5) + 5; 
            const randomDegrees = Math.floor(Math.random() * 360);
            const totalRotation = currentRotation + (spins * 360) + randomDegrees;

            currentRotation = totalRotation;
            
            // Apply CSS transformation for spin
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            // Wait for the CSS transition to finish (4000ms)
            setTimeout(() => {
                showResult();
                isSpinning = false;
                btn.disabled = false;
            }, 4000);
        }

        function showResult() {
            // Pick a random question from the 100 items array
            const randomIndex = Math.floor(Math.random() * items.length);
            const selectedItem = items[randomIndex];

            const modal = document.getElementById('resultModal');
            const categoryLabel = document.getElementById('categoryLabel');
            const questionText = document.getElementById('questionText');

            // Set content based on selected item
            categoryLabel.textContent = `[ ${selectedItem.type.toUpperCase()} ]`;
            questionText.textContent = selectedItem.text;

            // Update label styling
            categoryLabel.className = 'category-label'; // Reset class
            if (selectedItem.type === 'Truth') {
                categoryLabel.classList.add('cat-truth');
            } else if (selectedItem.type === 'Trivia') {
                categoryLabel.classList.add('cat-trivia');
            } else {
                categoryLabel.classList.add('cat-dare');
            }

            // Show the modal
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }
    </script>
</body>
</html>
