<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 · Muhammad Hanif</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ========== GAME WRAPPER ========== */
        .game-page-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            /* Padding atas diperbesar agar tidak tertimpa header fixed */
            padding: 8rem 1rem 4rem; 
            min-height: 100vh;
            user-select: none;
        }

        /* ========== GAME CSS ========== */
        .game-container {
            width: 420px;
            max-width: 100%;
            background: #fff;
            border: 1px solid var(--border, #dcdcdc);
            padding: 1.8rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .title-section h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text, #111);
            line-height: 1;
            margin: 0;
        }

        .title-section .game-subtitle {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-light, #666);
            font-weight: 600;
            margin-top: 4px;
        }

        .score-box {
            background: var(--surface, #fafafa);
            border: 1px solid var(--border, #dcdcdc);
            padding: 0.5rem 1.2rem;
            text-align: center;
            border-radius: 8px;
        }

        .score-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-light, #666);
            font-weight: 600;
        }

        .score-value {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text, #111);
            transition: transform 0.2s ease;
        }

        .score-value.pop {
            animation: scorePop 0.3s ease;
        }

        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .board-wrapper {
            position: relative;
            aspect-ratio: 1 / 1;
            touch-action: none; /* Mencegah pull-to-refresh bawaan browser */
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: var(--surface, #fafafa);
            border: 2px solid var(--border, #dcdcdc);
            padding: 8px;
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 8px;
        }

        .cell-bg {
            background: #eaeaea;
            aspect-ratio: 1 / 1;
            border-radius: 4px;
        }

        .tile-layer {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            pointer-events: none;
            z-index: 2;
        }

        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--text, #111);
            border-radius: 4px;
            transition: left 0.14s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                top 0.14s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                width 0.14s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                height 0.14s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                line-height 0.14s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: left, top;
            z-index: 3;
        }

        .tile.merge-target {
            z-index: 6 !important;
            animation: tileMerge 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .tile.spawn-anim {
            animation: tileSpawn 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tile.moving-to-merge {
            z-index: 4;
        }

        @keyframes tileMerge {
            0% { transform: scale(1); }
            40% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        @keyframes tileSpawn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .tile[data-value="2"] { background: #ededed; color: #111; }
        .tile[data-value="4"] { background: #e0e0e0; color: #111; }
        .tile[data-value="8"] { background: #c8c8c8; color: #111; }
        .tile[data-value="16"] { background: #b0b0b0; color: #fff; }
        .tile[data-value="32"] { background: #969696; color: #fff; }
        .tile[data-value="64"] { background: #7c7c7c; color: #fff; }
        .tile[data-value="128"] { background: #626262; color: #fff; font-size: 1.3rem; }
        .tile[data-value="256"] { background: #4a4a4a; color: #fff; font-size: 1.3rem; }
        .tile[data-value="512"] { background: #323232; color: #fff; font-size: 1.3rem; }
        .tile[data-value="1024"] { background: #1e1e1e; color: #fff; font-size: 1.1rem; }
        .tile[data-value="2048"] { background: #000000; color: #fff; font-size: 1.1rem; animation: pulse 0.8s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0,0,0,0.2); }
            50% { box-shadow: 0 0 0 8px rgba(0,0,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
        }

        .game-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.7rem 1.6rem;
            background: var(--accent, #000);
            color: #fff;
            border: 2px solid var(--accent, #000);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            border-radius: 8px;
        }

        .game-btn:hover {
            background: #fff;
            color: var(--accent, #000);
        }

        .game-btn:active { transform: scale(0.96); }

        .message-area {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-light, #666);
            min-height: 1.2rem;
        }

        /* ========== RESPONSIVE GAME ========== */
        @media (max-width: 450px) {
            .board { gap: 4px; padding: 4px; }
            .tile-layer { top: 4px; left: 4px; right: 4px; bottom: 4px; }
            .tile { font-size: 1.1rem; }
            .tile[data-value="128"],
            .tile[data-value="256"],
            .tile[data-value="512"] { font-size: 0.9rem; }
            .tile[data-value="1024"],
            .tile[data-value="2048"] { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="index.html">MUHAMMAD HANIF</a></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="experience.html">Experience</a>
            <a href="achievements.html">Awards</a>
            <a href="gallery.html">Gallery</a>
            <a href="blog.html" class="active">Archives</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <!-- ========== AREA GAME ========== -->
    <div class="game-page-wrapper">
        <div class="game-container">
            <div class="game-header">
                <div class="title-section">
                    <h1>2048</h1>
                    <div class="game-subtitle"></div>
                </div>
                <div style="display:flex; gap:0.8rem;">
                    <div class="score-box">
                        <div class="score-label">Score</div>
                        <div class="score-value" id="scoreDisplay">0</div>
                    </div>
                    <div class="score-box">
                        <div class="score-label">Best</div>
                        <div class="score-value" id="bestDisplay">0</div>
                    </div>
                </div>
            </div>

            <div class="board-wrapper">
                <div class="board" id="boardBg"></div>
                <div class="tile-layer" id="tileLayer"></div>
            </div>

            <div style="display:flex; justify-content: space-between; align-items: center; gap:1rem; flex-wrap:wrap;">
                <button class="game-btn" id="restartBtn">New Game</button>
                <div class="message-area" id="message"></div>
            </div>
        </div>
    </div>

    <!-- ========== FOOTER ========== -->
    <footer style="padding: 5rem 8%; border-top: 1px solid var(--border); text-align: center; margin-top: 5rem;">
        <p style="font-size: 0.8rem; color: var(--text-light); letter-spacing: 1px;">© 2026 MUHAMMAD HANIF. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        (function() {
            // ========== DOM ELEMENTS ==========
            const boardBg = document.getElementById('boardBg');
            const tileLayer = document.getElementById('tileLayer');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const bestDisplay = document.getElementById('bestDisplay');
            const messageEl = document.getElementById('message');
            const restartBtn = document.getElementById('restartBtn');

            // ========== GAME STATE ==========
            let grid = []; 
            let score = 0;
            let bestScore = 0;
            let gameOver = false;
            let win = false;
            let tileIdCounter = 0;
            let tiles = [];
            let isAnimating = false;

            // ========== LOCAL STORAGE ==========
            try {
                const saved = localStorage.getItem('2048_best');
                if (saved) bestScore = parseInt(saved, 10) || 0;
            } catch (e) {}

            // ========== GRID HELPERS ==========
            function emptyGrid() {
                return Array(4).fill().map(() => Array(4).fill(null));
            }

            function getTileSize() {
                const boardRect = tileLayer.getBoundingClientRect();
                const gap = window.innerWidth <= 450 ? 4 : 8;
                const size = (boardRect.width - gap * 3) / 4;
                return { size, gap };
            }

            function positionTile(tile) {
                const { size, gap } = getTileSize();
                const left = tile.c * (size + gap);
                const top = tile.r * (size + gap);
                tile.element.style.width = size + 'px';
                tile.element.style.height = size + 'px';
                tile.element.style.left = left + 'px';
                tile.element.style.top = top + 'px';
                tile.element.style.lineHeight = size + 'px';
            }

            function positionAllTiles() {
                tiles.forEach(t => positionTile(t));
            }

            function renderBoardBg() {
                boardBg.innerHTML = '';
                for (let i = 0; i < 16; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell-bg';
                    boardBg.appendChild(cell);
                }
            }

            function createTileElement(id, value) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = value;
                tile.setAttribute('data-value', value);
                tile.setAttribute('data-id', id);
                return tile;
            }

            function addRandomTile(animate = true) {
                const empties = [];
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (grid[r][c] === null) empties.push({ r, c });
                    }
                }
                if (empties.length === 0) return false;
                
                const { r, c } = empties[Math.floor(Math.random() * empties.length)];
                const value = Math.random() < 0.9 ? 2 : 4;
                const id = ++tileIdCounter;
                
                const tileEl = createTileElement(id, value);
                tileLayer.appendChild(tileEl);
                
                const tileObj = { id, value, r, c, element: tileEl };
                grid[r][c] = tileObj;
                tiles.push(tileObj);
                
                if (animate) {
                    tileEl.classList.add('spawn-anim');
                    tileEl.addEventListener('animationend', () => tileEl.classList.remove('spawn-anim'), { once: true });
                }
                positionTile(tileObj);
                return true;
            }

            function updateScores(animated = true) {
                scoreDisplay.textContent = score;
                if (animated) {
                    scoreDisplay.classList.remove('pop');
                    void scoreDisplay.offsetWidth;
                    scoreDisplay.classList.add('pop');
                }
                if (score > bestScore) {
                    bestScore = score;
                    try { localStorage.setItem('2048_best', bestScore); } catch (e) {}
                }
                bestDisplay.textContent = bestScore;
            }

            // ========== CORE ENGINE ==========
            function move(direction) {
                if (gameOver || isAnimating) return false;
                let moved = false;
                
                // Vector pergerakan
                const vector = {
                    0: { r: 0, c: -1 }, // Kiri
                    1: { r: -1, c: 0 }, // Atas
                    2: { r: 0, c: 1 },  // Kanan
                    3: { r: 1, c: 0 }   // Bawah
                }[direction];

                const traversals = { r: [0, 1, 2, 3], c: [0, 1, 2, 3] };
                if (vector.r === 1) traversals.r.reverse();
                if (vector.c === 1) traversals.c.reverse();

                const mergedThisTurn = [];

                traversals.r.forEach(r => {
                    traversals.c.forEach(c => {
                        const tile = grid[r][c];
                        if (tile) {
                            let currR = r;
                            let currC = c;
                            let nextR = currR + vector.r;
                            let nextC = currC + vector.c;
                            
                            while (nextR >= 0 && nextR < 4 && nextC >= 0 && nextC < 4 && grid[nextR][nextC] === null) {
                                currR = nextR;
                                currC = nextC;
                                nextR += vector.r;
                                nextC += vector.c;
                            }

                            let merged = false;
                            if (nextR >= 0 && nextR < 4 && nextC >= 0 && nextC < 4) {
                                const targetTile = grid[nextR][nextC];
                                if (targetTile && targetTile.value === tile.value && !mergedThisTurn.includes(targetTile)) {
                                    merged = true;
                                    moved = true;
                                    
                                    grid[r][c] = null;
                                    targetTile.value *= 2;
                                    score += targetTile.value;
                                    mergedThisTurn.push(targetTile);
                                    
                                    tile.r = nextR;
                                    tile.c = nextC;
                                    positionTile(tile);
                                    tile.element.classList.add('moving-to-merge');
                                    tile.element.style.opacity = '0';
                                    
                                    setTimeout(() => {
                                        if (tile.element.parentNode) tile.element.remove();
                                        tiles = tiles.filter(t => t.id !== tile.id);
                                    }, 200);

                                    targetTile.element.textContent = targetTile.value;
                                    targetTile.element.setAttribute('data-value', targetTile.value);
                                    targetTile.element.classList.add('merge-target');
                                    targetTile.element.addEventListener('animationend', () => targetTile.element.classList.remove('merge-target'), { once: true });
                                }
                            }

                            if (!merged && (currR !== r || currC !== c)) {
                                moved = true;
                                grid[currR][currC] = tile;
                                grid[r][c] = null;
                                tile.r = currR;
                                tile.c = currC;
                                positionTile(tile);
                            }
                        }
                    });
                });

                return moved;
            }

            function movesAvailable() {
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (grid[r][c] === null) return true;
                        if (c < 3 && grid[r][c + 1] && grid[r][c].value === grid[r][c + 1].value) return true;
                        if (r < 3 && grid[r + 1][c] && grid[r][c].value === grid[r + 1][c].value) return true;
                    }
                }
                return false;
            }

            function checkWin() {
                return tiles.some(t => t.value === 2048);
            }

            function processMove(direction) {
                if (isAnimating || gameOver) return;
                const moved = move(direction);
                
                if (moved) {
                    isAnimating = true;
                    updateScores(true);
                    
                    if (checkWin() && !win) {
                        win = true;
                        messageEl.textContent = '🎉 You reached 2048! Keep going!';
                        messageEl.style.color = '#111';
                    }
                    if (!movesAvailable()) {
                        gameOver = true;
                        messageEl.textContent = 'Game Over. No moves left.';
                        messageEl.style.color = '#444';
                    }
                    
                    setTimeout(() => {
                        addRandomTile(true);
                        if (!movesAvailable() && !gameOver) {
                            gameOver = true;
                            messageEl.textContent = 'Game Over. No moves left.';
                            messageEl.style.color = '#444';
                        }
                        setTimeout(() => {
                            isAnimating = false;
                        }, 100);
                    }, 140);
                }
            }

            function restartGame() {
                grid = emptyGrid();
                score = 0;
                gameOver = false;
                win = false;
                isAnimating = false;
                tileIdCounter = 0;
                messageEl.textContent = '';
                messageEl.style.color = 'var(--text-light)';

                tiles.forEach(t => {
                    if (t.element && t.element.parentNode) t.element.remove();
                });
                tiles = [];

                addRandomTile(false);
                addRandomTile(false);
                updateScores(false);
            }

            // ========== INPUT HANDLERS ==========
            function handleKey(e) {
                const key = e.key;
                if (key.startsWith('Arrow')) e.preventDefault();
                if (gameOver || isAnimating) return;
                switch (key) {
                    case 'ArrowLeft': processMove(0); break;
                    case 'ArrowUp': processMove(1); break;
                    case 'ArrowRight': processMove(2); break;
                    case 'ArrowDown': processMove(3); break;
                }
            }

            let touchStartX = 0, touchStartY = 0;
            function handleTouchStart(e) {
                if (gameOver) return;
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            }
            function handleTouchEnd(e) {
                if (gameOver || isAnimating) return;
                const touch = e.changedTouches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
                if (Math.abs(dx) > Math.abs(dy)) {
                    processMove(dx > 0 ? 2 : 0);
                } else {
                    processMove(dy > 0 ? 3 : 1);
                }
            }

            window.addEventListener('resize', () => positionAllTiles());
            document.addEventListener('keydown', handleKey);
            
            const boardWrapper = document.querySelector('.board-wrapper');
            boardWrapper.addEventListener('touchstart', handleTouchStart, { passive: false });
            
            // Perbaikan agar layar tidak ikutan scroll saat main di HP
            boardWrapper.addEventListener('touchmove', function(e) {
                e.preventDefault(); 
            }, { passive: false });
            
            boardWrapper.addEventListener('touchend', handleTouchEnd);
            restartBtn.addEventListener('click', restartGame);

            // Init
            renderBoardBg();
            
            // Menunggu CSS ter-load sempurna agar boundingBox terdeteksi dengan tepat
            setTimeout(restartGame, 50); 
        })();
    </script>
</body>
</html>
